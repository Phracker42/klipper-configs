#=====================================================
# Includes
#=====================================================

[include mainsail.cfg]
[include BTTmanta_m8p.cfg]
[include V0Display.cfg]

#=====================================================
# Extruder
#=====================================================

[extruder]
max_extrude_only_distance: 105.00
step_pin: PC7
dir_pin: !PC8
enable_pin: !PD2
microsteps: 16
gear_ratio: 50:10
rotation_distance: 22.331
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PA0
sensor_pin: PB0
sensor_type: Generic 3950
control: pid
pid_Kp: 30.441
pid_Ki: 10.681
pid_Kd: 21.689
min_temp: 0
# TZ-V6-2.0 Hotend 300C max
max_temp: 290

#=====================================================
# Z Home
#=====================================================

[safe_z_home]
home_xy_position: 60,60
z_hop: 0.30

#=====================================================
# Bed
#=====================================================

[heater_bed]
heater_pin: PF5
sensor_pin: PB1
sensor_type: Generic 3950
control: pid
pid_Kp: 59.589
pid_Ki: 2.580
pid_Kd: 344.124
min_temp: 0
max_temp: 80

[exclude_object]

#####################################################################
# PAUSE AUTO-CANCEL CONFIG (BRANCH)
#####################################################################

[gcode_macro PAUSE_TIMEOUT_CONFIG]
description: Auto-cancel print after long pause
variable_enabled: 1              # 1 = ENABLED, 0 = DISABLED
variable_cancel_delay_s: 1800    # 30 minutes
gcode:
  ; config only

[delayed_gcode PAUSE_AUTO_CANCEL]
gcode:
  {% set cfg = printer["gcode_macro PAUSE_TIMEOUT_CONFIG"] %}
  {% if cfg.enabled|int == 1 and printer.pause_resume.is_paused %}
    M117 Pause timeout – canceling
    CANCEL_PRINT
  {% endif %}


#####################################################################
# Z BIAS — GOLDEN
#####################################################################

[gcode_macro Z_BIAS_CONFIG]
variable_enabled: 1
variable_PLA: 0.00
variable_PETG: 0.02
variable_ABS: -0.03
variable_ASA: -0.03
variable_NGEN: 0.02
variable_NGEN_FLEX: 0.00
variable_TPU: 0.00
variable_DEFAULT: 0.00
gcode:
  ; config only

[gcode_macro APPLY_Z_BIAS]
description: Apply first-layer Z bias safely (FINAL)
variable_active: 0
gcode:
  {% set cfg = printer["gcode_macro Z_BIAS_CONFIG"] %}
  {% set material = params.MATERIAL|default("GENERIC")|upper %}

  {% if cfg.enabled|int == 1 %}

    {% set bias = cfg.default|float %}

    {% if material == "PLA" %}
      {% set bias = cfg.pla|float %}
    {% elif material == "PETG" %}
      {% set bias = cfg.petg|float %}
    {% elif material in ["ABS", "ASA"] %}
      {% set bias = cfg.abs|float %}
    {% elif material == "NGEN" %}
      {% set bias = cfg.ngen|float %}
    {% elif material in ["NGEN FLEX", "NGEN_FLEX", "TPU", "TPE"] %}
      {% set bias = cfg.ngen_flex|float %}
    {% endif %}

    {% if bias != 0.0 %}
      SET_GCODE_OFFSET Z_ADJUST={bias} MOVE=0
      SET_GCODE_VARIABLE MACRO=APPLY_Z_BIAS VARIABLE=active VALUE=1
      M117 Z bias {bias}mm ({material})
    {% else %}
      SET_GCODE_VARIABLE MACRO=APPLY_Z_BIAS VARIABLE=active VALUE=0
    {% endif %}

  {% else %}
    SET_GCODE_VARIABLE MACRO=APPLY_Z_BIAS VARIABLE=active VALUE=0
  {% endif %}

[gcode_macro CLEAR_Z_BIAS]
gcode:
  {% if printer["gcode_macro APPLY_Z_BIAS"].active|int == 1 %}
    SET_GCODE_OFFSET Z_ADJUST=0.0 MOVE=0
    SET_GCODE_VARIABLE MACRO=APPLY_Z_BIAS VARIABLE=active VALUE=0
    M117 Z bias cleared
  {% endif %}

[gcode_macro SET_PRINT_STATS_INFO]
description: Overwrite, to get pause_next_layer and pause_at_layer feature, plus Z-bias auto-clear
rename_existing: SET_PRINT_STATS_INFO_BASE
gcode:
  {% if pause_next_layer.enable %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_next_layer" % pause_next_layer.call}'
    {pause_next_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
    SET_PAUSE_NEXT_LAYER ENABLE=0
  {% elif pause_at_layer.enable and params.CURRENT_LAYER is defined and params.CURRENT_LAYER|int == pause_at_layer.layer %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_at_layer [%d]" % (pause_at_layer.call, pause_at_layer.layer)}'
    {pause_at_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
    SET_PAUSE_AT_LAYER ENABLE=0
  {% endif %}
  SET_PRINT_STATS_INFO_BASE {rawparams}
  {% if params.CURRENT_LAYER|default(0)|int == 2 %}
    CLEAR_Z_BIAS
  {% endif %}

#####################################################################
# SFS V2.0 — GOLDEN
#####################################################################

[gcode_macro SFS_MOTION_GUARD]
variable_last_trigger: 0
variable_min_interval_s: 8
variable_fail_count: 0
variable_fail_required: 2
gcode:
  ; state only


[gcode_macro SFS_RUNOUT]
description: Unified SFS runout handler
variable_triggered: 0
gcode:
  {% if printer["gcode_macro SFS_RUNOUT"].triggered == 0 %}
    SET_GCODE_VARIABLE MACRO=SFS_RUNOUT VARIABLE=triggered VALUE=1

    {% if params.SOURCE == "MOTION" %}
      M117 SFS JAM DETECTED
    {% elif params.SOURCE == "SWITCH" %}
      M117 SFS FILAMENT OUT
    {% else %}
      M117 SFS FILAMENT ERROR
    {% endif %}

    {% if printer.extruder.can_extrude|lower == 'true' %}
      G91
      G1 E-5 F2400
      G90
    {% endif %}

    SFS_PARK
    UPDATE_DELAYED_GCODE ID=PAUSE_AUTO_CANCEL DURATION={printer["gcode_macro PAUSE_TIMEOUT_CONFIG"].cancel_delay_s}
    PAUSE
  {% endif %}

[gcode_macro SFS_RUNOUT_GUARDED]
description: Guarded SFS motion handler with debounce + fail counter (DEBUG)
gcode:
  {% set g = printer["gcode_macro SFS_MOTION_GUARD"] %}
  {% set now = printer["print_stats"].print_duration|int %}

  {% if now - g.last_trigger < g.min_interval_s %}
    ; debounce — ignore
    M117 SFS debounce ({now - g.last_trigger}s)
  {% else %}
    {% set next_fail = g.fail_count + 1 %}
    SET_GCODE_VARIABLE MACRO=SFS_MOTION_GUARD VARIABLE=last_trigger VALUE={now}
    SET_GCODE_VARIABLE MACRO=SFS_MOTION_GUARD VARIABLE=fail_count VALUE={next_fail}

    M117 SFS fail {next_fail}/{g.fail_required}

    {% if next_fail >= g.fail_required %}
      SET_GCODE_VARIABLE MACRO=SFS_MOTION_GUARD VARIABLE=fail_count VALUE=0
      M117 SFS JAM CONFIRMED
      SFS_RUNOUT SOURCE=MOTION
    {% endif %}
  {% endif %}


[gcode_macro SFS_PARK]
gcode:
  {% set x_park = printer.toolhead.axis_maximum.x - 5 %}
  {% set y_park = printer.toolhead.axis_maximum.y - 5 %}
  M400
  G90
  G1 X{x_park} Y{y_park} F9000

[gcode_macro SFS_INSERT]
gcode:
  SET_GCODE_VARIABLE MACRO=SFS_RUNOUT VARIABLE=triggered VALUE=0
  M117 Filament detected

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
  UPDATE_DELAYED_GCODE ID=PAUSE_AUTO_CANCEL DURATION=0

  {% if printer.pause_resume.is_paused %}
    SET_GCODE_VARIABLE MACRO=SFS_RUNOUT VARIABLE=triggered VALUE=0
    M117 Resuming print
    RESUME_BASE
  {% endif %}


#####################################################################
# Filament Sensors
#####################################################################

[filament_switch_sensor sfs_switch]
switch_pin: ^PC0
pause_on_runout: False
runout_gcode: SFS_RUNOUT SOURCE=SWITCH
insert_gcode: SFS_INSERT

[filament_motion_sensor sfs_motion]
switch_pin: ^PF10
extruder: extruder
detection_length: 3.2
pause_on_runout: False
runout_gcode:
  SFS_RUNOUT_GUARDED

#####################################################################
# BED PID SETTLE — FIXED (TOP LEVEL)
#####################################################################

[gcode_macro BED_PID_SETTLE]
variable_target: 0.0
variable_tol: 0.3
variable_stable_ms: 30000
variable_max_ms: 600000
variable_start_time: 0
variable_stable_time: 0
gcode:
  SET_GCODE_VARIABLE MACRO=BED_PID_SETTLE VARIABLE=target VALUE={params.TARGET|float}
  SET_GCODE_VARIABLE MACRO=BED_PID_SETTLE VARIABLE=tol VALUE={params.TOL|float}
  SET_GCODE_VARIABLE MACRO=BED_PID_SETTLE VARIABLE=stable_ms VALUE={params.STABLE_MS|int}
  SET_GCODE_VARIABLE MACRO=BED_PID_SETTLE VARIABLE=max_ms VALUE={params.MAX_MS|int}
  SET_GCODE_VARIABLE MACRO=BED_PID_SETTLE VARIABLE=start_time VALUE={printer.clock|int}
  SET_GCODE_VARIABLE MACRO=BED_PID_SETTLE VARIABLE=stable_time VALUE=0
  M117 Bed settling
  UPDATE_DELAYED_GCODE ID=BED_PID_SETTLE_CHECK DURATION=1

[delayed_gcode BED_PID_SETTLE_CHECK]
gcode:
  {% set m = printer["gcode_macro BED_PID_SETTLE"] %}
  {% set t = printer.heater_bed.temperature|float %}
  {% set now = printer.clock|int %}
  {% if (now - m.start_time) * 1000 >= m.max_ms %}
    M117 Bed settle timeout
    UPDATE_DELAYED_GCODE ID=BED_PID_SETTLE_CHECK DURATION=0
  {% elif (t - m.target)|abs <= m.tol %}
    {% if m.stable_time == 0 %}
      SET_GCODE_VARIABLE MACRO=BED_PID_SETTLE VARIABLE=stable_time VALUE={now}
      UPDATE_DELAYED_GCODE ID=BED_PID_SETTLE_CHECK DURATION=1
    {% elif (now - m.stable_time) * 1000 >= m.stable_ms %}
      M117 Bed stable
      UPDATE_DELAYED_GCODE ID=BED_PID_SETTLE_CHECK DURATION=0
    {% else %}
      UPDATE_DELAYED_GCODE ID=BED_PID_SETTLE_CHECK DURATION=1
    {% endif %}
  {% else %}
    SET_GCODE_VARIABLE MACRO=BED_PID_SETTLE VARIABLE=stable_time VALUE=0
    UPDATE_DELAYED_GCODE ID=BED_PID_SETTLE_CHECK DURATION=1
  {% endif %}

#####################################################################
# AUTO FAN PROFILE
#####################################################################

[gcode_macro AUTO_FAN_PROFILE]
gcode:
  {% set m = params.MATERIAL|upper %}
  {% if m in ["ABS","ASA","NYLON","PC"] %}
    SET_FAN_SPEED FAN=fan SPEED=0
  {% elif m in ["PETG","NGEN"] %}
    SET_FAN_SPEED FAN=fan SPEED=0.25
  {% elif m in ["NGEN FLEX","NGEN_FLEX","TPU","TPE"] %}
    SET_FAN_SPEED FAN=fan SPEED=0.10
  {% endif %}

#####################################################################
# PRINT START — GOLDEN
#####################################################################

[gcode_macro PRINT_START]
gcode:
  {% set bed = params.BED|int %}
  {% set hotend = params.EXTRUDER|int %}
  {% set material = params.MATERIAL|upper %}
  {% set x = printer.toolhead.axis_maximum.x / 2 %}
  {% set y = printer.toolhead.axis_maximum.y / 2 %}

  CLEAR_PAUSE
  SET_GCODE_VARIABLE MACRO=SFS_RUNOUT VARIABLE=triggered VALUE=0

  G28
  G90
  G1 X{x} Y{y} Z15 F9000

  M107
  M190 S{bed}

  {% if bed >= 90 %}
    BED_PID_SETTLE TARGET={bed} TOL=0.3 STABLE_MS=30000 MAX_MS=600000
  {% elif bed >= 70 %}
    BED_PID_SETTLE TARGET={bed} TOL=0.4 STABLE_MS=20000 MAX_MS=240000
  {% endif %}

  APPLY_Z_BIAS MATERIAL={material}

  M109 S{hotend}
  AUTO_FAN_PROFILE MATERIAL={material}

  M83
  G92 E0
  G1 X5 Y4 Z0.4 F10000
  G1 X115 E20 F1000
  G92 E0

[gcode_macro END_PRINT]
description: Safe end-of-print park with material-aware cooldown (V0)
gcode:
  M400                          ; Finish all queued moves

  {% set material = params.MATERIAL|default("GENERIC")|upper %}

  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E-3 F1800                ; Small retract to reduce ooze
    G90
  {% endif %}

  {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
  {% set current_z = printer.toolhead.position.z|float %}
  {% set lift = 5.0 %}
  {% if current_z + lift > max_z %}
    {% set lift = max_z - current_z %}
  {% endif %}

  {% if lift > 0 %}
    G91
    G1 Z{lift} F3000            ; Z-safe lift
    G90
  {% endif %}

  {% set x_park = printer.toolhead.axis_maximum.x - 5 %}
  {% set y_park = printer.toolhead.axis_maximum.y - 5 %}
  G1 X{x_park} Y{y_park} F9000  ; Park back-right

  ; -------- MATERIAL-AWARE COOLDOWN --------
  {% if material in ["ABS","ASA","PC"] %}
    M104 S140                   ; Controlled hotend cooldown
    M140 S60                    ; Hold bed to reduce warp
    M117 Cooling ({material}) – bed hold
  {% else %}
    M104 S0                     ; Hotend off
    M140 S0                     ; Bed off
    M117 Print complete
  {% endif %}

  M107                          ; Fan off



