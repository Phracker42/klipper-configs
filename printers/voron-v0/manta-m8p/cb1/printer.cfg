#####################################################################
# CHANGELOG — printer.cfg
#
# Format:
#   - Version number
#   - Date (YYYY-MM-DD)
#   - Status (Frozen / Testing / Deprecated)
#   - Summary of changes
#
# ---------------------------------------------------
#
# ---------------------------------------------------
#
# v1.9 — 2026-08-05 — TESTING
# - Reverted sfs_motion detection_length 3.2 -> 3.6mm. This is the
#   value this exact printer already proved stable (documented on
#   BookStack "SFS Architecture & Tuning") before it regressed to
#   3.2 at some point without the docs being updated to match —
#   root cause of the recent run of SFS false positives.
# - Removed SFS_MOTION_GUARD / SFS_RUNOUT_GUARDED (the debounce +
#   2-strike fail-counter layer). Verified against Klipper's actual
#   source (filament_switch_sensor.py RunoutHelper) that
#   runout_gcode is edge-triggered — it fires once per state
#   transition, not repeatedly while a runout condition persists.
#   A genuine, persistent jam (filament truly stops, encoder never
#   toggles again) would fire the guard exactly once, land at
#   "fail 1/2", and never reach fail_required=2 — meaning real
#   jams were not reliably confirmed by this layer. sfs_motion now
#   calls SFS_RUNOUT directly (single-shot), matching BTT's own
#   reference config and Klipper's standard pattern; a correctly
#   tuned detection_length is the real defense against false
#   positives, not a secondary counter layered on top of it.
# - PRINT_START now explicitly re-enables both SFS sensors
#   (SET_FILAMENT_SENSOR ENABLE=1) at the start of every print.
#   Found evidence in klippy.log of both sensors having been
#   manually disabled via the API during earlier troubleshooting —
#   that disabled state lives inside Klipper's sensor object, not
#   a gcode_macro variable, so it wasn't covered by any of the
#   existing PRINT_START state resets and would silently persist
#   across prints if Klipper wasn't restarted in between.
#
# ---------------------------------------------------
#
# v1.8 — 2026-08-03 — TESTING
# - Chamber sensor physically replaced (faulty AHT10 -> AHT20).
#   Updated sensor_type in BTTmanta_m8p.cfg to match; same I2C
#   address/pins, protocol-compatible, zero errors since swap.
# - Tightened min_temp on [extruder] (0 -> 10) and [heater_bed]
#   (0 -> 5). 0 meant a disconnected/failed thermistor reading low
#   wouldn't trip the safety floor.
# - Increased [safe_z_home] z_hop (0.30mm -> 5.0mm) for real
#   clearance before the toolhead crosses to bed center to home Z;
#   also now consistent with END_PRINT's existing 5mm Z-safe lift.
# - Added NYLON and PC to Z_BIAS_CONFIG / APPLY_Z_BIAS (-0.03 each,
#   as independently-tunable variables). Both were already grouped
#   with ABS/ASA in AUTO_FAN_PROFILE and END_PRINT's cooldown-hold
#   list as warp-prone/poor-adhesion materials, but had no Z-bias
#   entry and were silently falling through to the 0.00 default.
#
# ---------------------------------------------------
#
# v1.7 — 2026-08-02 — TESTING
# - Fixed SET_PRINT_STATS_INFO override silently clobbering
#   mainsail.cfg's pause_next_layer / pause_at_layer handling
#   (Mainsail UI "pause at layer" was a no-op prior to this fix)
# - Uncommented control:pid for [extruder] and [heater_bed] and
#   synced Kp/Ki/Kd to the real tuned values from SAVE_CONFIG,
#   so heating is correctly configured even without SAVE_CONFIG
# - Fixed AUTO_FAN_PROFILE in PRINT_START being immediately undone
#   by M107 a few lines later, before the hotend even finished
#   heating — material-based part-fan speed never actually reached
#   the print. Moved M107 to right after homing (fan off during
#   heat-soak) and AUTO_FAN_PROFILE to right before the priming
#   purge, so the material-correct speed is what actually sticks.
# - CRITICAL: BED_PID_SETTLE referenced printer.clock, which does
#   not exist. Any print with bed target >=70C (ABS/ASA/PETG/PC —
#   most non-PLA materials) would hard-error partway through
#   PRINT_START with heaters already on. Confirmed via live test
#   (jinja2.exceptions.UndefinedError). Switched to
#   printer.toolhead.estimated_print_time, verified working.
# - SFS_MOTION_GUARD's fail_count/last_trigger were never reset
#   between prints (only SFS_RUNOUT.triggered was). A single non-jam
#   motion blip near the end of one print could cause the very next
#   blip of the following print to instantly false-trigger a jam.
#   Now reset at the top of PRINT_START.
# - PAUSE_AUTO_CANCEL's 30-min timer was only disarmed by RESUME,
#   not CANCEL_PRINT. Cancelling an SFS jam pause (instead of
#   resuming) left a stale countdown armed that could cancel an
#   unrelated later print if it also happened to pause. Now
#   defensively disarmed at the top of PRINT_START.
#
# ---------------------------------------------------
#
# v1.6 — 2026-02-17 — TESTING
# - Added SFS motion fail counter with debounce guard
#   (min_interval = 8s, fail_required = 2)
# - Added live SFS debug output via LCD (M117):
#   * debounce timing
#   * fail counter
#   * jam confirmation
# - Increased motion detection_length to 3.2 mm
# - Hardened SFS against retraction and elastic filament effects
# - Added material-aware END_PRINT with:
#   * Z-safe lift
#   * back-right park
#   * controlled cooldown for ABS / ASA / PC
# - Integrated pause auto-cancel arming during SFS events
#
# ---------------------------------------------------
#
# v1.5 — 2026-02-16 — FROZEN
# - Fixed false SFS motion jams by eliminating PTFE float
# - Enabled guarded SFS motion sensing (detection_length = 3.4 mm)
# - Added Z-safe END_PRINT with back-right park
# - Added material-aware cooldown logic at END_PRINT
# - Finalized Z-bias system (auto-clear after layer 2)
# - Added pause auto-cancel (armed only during SFS events)
#
# ---------------------------------------------------
#
# v1.4 — 2026-02-15 — DEPRECATED
# - Initial SFS integration
# - Motion sensor unstable due to PTFE compliance
# - END_PRINT missing Z safety (possible nozzle drag)
#
# ---------------------------------------------------
#
# v1.3 — 2026-02-14 — DEPRECATED
# - Early motion guard implementation
# - Detection length experimentation (2.6–4.0 mm)
# - False positives under retraction-heavy prints
#
# ---------------------------------------------------
#
# v1.2 — 2026-02-13 — DEPRECATED
# - Unified SFS runout handler (motion + switch)
# - Initial Z-bias macros
# - Chamber monitoring experiments
#
# ---------------------------------------------------
#
# v1.1 — 2026-02-12 — DEPRECATED
# - First Klipper migration to Manta M8P + CB1
# - Basic PRINT_START / END_PRINT macros
#
# ---------------------------------------------------
#
# v1.0 — 2026-02-11 — DEPRECATED
# - Baseline Voron V0.2 configuration
#
#####################################################################

#=====================================================
# Includes
#=====================================================

[include mainsail.cfg]
[include BTTmanta_m8p.cfg]
[include V0Display.cfg]

#=====================================================
# Extruder
#=====================================================

[extruder]
max_extrude_only_distance: 105.00
step_pin: PC7
dir_pin: !PC8
enable_pin: !PD2
microsteps: 16
gear_ratio: 50:10
rotation_distance: 22.331
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PA0
sensor_pin: PB0
sensor_type: Generic 3950
control: pid
pid_Kp: 30.441
pid_Ki: 10.681
pid_Kd: 21.689
min_temp: 10
# TZ-V6-2.0 Hotend 300C max
max_temp: 290

#=====================================================
# Z Home
#=====================================================

[safe_z_home]
home_xy_position: 60,60
z_hop: 5.0

#=====================================================
# Bed
#=====================================================

[heater_bed]
heater_pin: PF5
sensor_pin: PB1
sensor_type: Generic 3950
control: pid
pid_Kp: 59.589
pid_Ki: 2.580
pid_Kd: 344.124
min_temp: 5
max_temp: 80

[exclude_object]

#####################################################################
# PAUSE AUTO-CANCEL CONFIG (BRANCH)
#####################################################################

[gcode_macro PAUSE_TIMEOUT_CONFIG]
description: Auto-cancel print after long pause
variable_enabled: 1              # 1 = ENABLED, 0 = DISABLED
variable_cancel_delay_s: 1800    # 30 minutes
gcode:
  ; config only

[delayed_gcode PAUSE_AUTO_CANCEL]
gcode:
  {% set cfg = printer["gcode_macro PAUSE_TIMEOUT_CONFIG"] %}
  {% if cfg.enabled|int == 1 and printer.pause_resume.is_paused %}
    M117 Pause timeout – canceling
    CANCEL_PRINT
  {% endif %}


#####################################################################
# Z BIAS — GOLDEN
#####################################################################

[gcode_macro Z_BIAS_CONFIG]
variable_enabled: 1
variable_PLA: 0.00
variable_PETG: 0.02
variable_ABS: -0.03
variable_ASA: -0.03
variable_NYLON: -0.03
variable_PC: -0.03
variable_NGEN: 0.02
variable_NGEN_FLEX: 0.00
variable_TPU: 0.00
variable_DEFAULT: 0.00
gcode:
  ; config only

[gcode_macro APPLY_Z_BIAS]
description: Apply first-layer Z bias safely (FINAL)
variable_active: 0
gcode:
  {% set cfg = printer["gcode_macro Z_BIAS_CONFIG"] %}
  {% set material = params.MATERIAL|default("GENERIC")|upper %}

  {% if cfg.enabled|int == 1 %}

    {% set bias = cfg.default|float %}

    {% if material == "PLA" %}
      {% set bias = cfg.pla|float %}
    {% elif material == "PETG" %}
      {% set bias = cfg.petg|float %}
    {% elif material in ["ABS", "ASA"] %}
      {% set bias = cfg.abs|float %}
    {% elif material == "NYLON" %}
      {% set bias = cfg.nylon|float %}
    {% elif material == "PC" %}
      {% set bias = cfg.pc|float %}
    {% elif material == "NGEN" %}
      {% set bias = cfg.ngen|float %}
    {% elif material in ["NGEN FLEX", "NGEN_FLEX", "TPU", "TPE"] %}
      {% set bias = cfg.ngen_flex|float %}
    {% endif %}

    {% if bias != 0.0 %}
      SET_GCODE_OFFSET Z_ADJUST={bias} MOVE=0
      SET_GCODE_VARIABLE MACRO=APPLY_Z_BIAS VARIABLE=active VALUE=1
      M117 Z bias {bias}mm ({material})
    {% else %}
      SET_GCODE_VARIABLE MACRO=APPLY_Z_BIAS VARIABLE=active VALUE=0
    {% endif %}

  {% else %}
    SET_GCODE_VARIABLE MACRO=APPLY_Z_BIAS VARIABLE=active VALUE=0
  {% endif %}

[gcode_macro CLEAR_Z_BIAS]
gcode:
  {% if printer["gcode_macro APPLY_Z_BIAS"].active|int == 1 %}
    SET_GCODE_OFFSET Z_ADJUST=0.0 MOVE=0
    SET_GCODE_VARIABLE MACRO=APPLY_Z_BIAS VARIABLE=active VALUE=0
    M117 Z bias cleared
  {% endif %}

[gcode_macro SET_PRINT_STATS_INFO]
description: Overwrite, to get pause_next_layer and pause_at_layer feature, plus Z-bias auto-clear
rename_existing: SET_PRINT_STATS_INFO_BASE
gcode:
  {% if pause_next_layer.enable %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_next_layer" % pause_next_layer.call}'
    {pause_next_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
    SET_PAUSE_NEXT_LAYER ENABLE=0
  {% elif pause_at_layer.enable and params.CURRENT_LAYER is defined and params.CURRENT_LAYER|int == pause_at_layer.layer %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_at_layer [%d]" % (pause_at_layer.call, pause_at_layer.layer)}'
    {pause_at_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
    SET_PAUSE_AT_LAYER ENABLE=0
  {% endif %}
  SET_PRINT_STATS_INFO_BASE {rawparams}
  {% if params.CURRENT_LAYER|default(0)|int == 2 %}
    CLEAR_Z_BIAS
  {% endif %}

#####################################################################
# SFS V2.0 — GOLDEN
#####################################################################

[gcode_macro SFS_RUNOUT]
description: Unified SFS runout handler
variable_triggered: 0
gcode:
  {% if printer["gcode_macro SFS_RUNOUT"].triggered == 0 %}
    SET_GCODE_VARIABLE MACRO=SFS_RUNOUT VARIABLE=triggered VALUE=1

    {% if params.SOURCE == "MOTION" %}
      M117 SFS JAM DETECTED
    {% elif params.SOURCE == "SWITCH" %}
      M117 SFS FILAMENT OUT
    {% else %}
      M117 SFS FILAMENT ERROR
    {% endif %}

    {% if printer.extruder.can_extrude|lower == 'true' %}
      G91
      G1 E-5 F2400
      G90
    {% endif %}

    SFS_PARK
    UPDATE_DELAYED_GCODE ID=PAUSE_AUTO_CANCEL DURATION={printer["gcode_macro PAUSE_TIMEOUT_CONFIG"].cancel_delay_s}
    PAUSE
  {% endif %}

#####################################################################
# SFS BENCH TEST — retract/extrude cycling without printing
#####################################################################

[gcode_macro TEST_SFS_RETRACTION]
description: Bench test for SFS tuning. Heats hotend, then cycles retract/unretract to stress-test the motion sensor without printing. USAGE: TEST_SFS_RETRACTION [LOOPS=160] [RETRACT=0.8] [DWELL=1800] [TEMP=200]
variable_active: 0
variable_cycle: 0
variable_max_cycles: 0
variable_retract_len: 0.8
variable_dwell_ms: 1800
gcode:
  {% set target_temp = params.TEMP|default(200)|int %}
  SET_GCODE_VARIABLE MACRO=TEST_SFS_RETRACTION VARIABLE=max_cycles VALUE={params.LOOPS|default(160)|int}
  SET_GCODE_VARIABLE MACRO=TEST_SFS_RETRACTION VARIABLE=retract_len VALUE={params.RETRACT|default(0.8)|float}
  SET_GCODE_VARIABLE MACRO=TEST_SFS_RETRACTION VARIABLE=dwell_ms VALUE={params.DWELL|default(1800)|int}
  SET_GCODE_VARIABLE MACRO=TEST_SFS_RETRACTION VARIABLE=cycle VALUE=0
  SET_GCODE_VARIABLE MACRO=TEST_SFS_RETRACTION VARIABLE=active VALUE=1
  M117 SFS test: heating
  M83
  M109 S{target_temp}
  M117 SFS test: running
  UPDATE_DELAYED_GCODE ID=TEST_SFS_RETRACTION_STEP DURATION=0.1

[gcode_macro STOP_SFS_TEST]
description: Abort an in-progress TEST_SFS_RETRACTION run
gcode:
  UPDATE_DELAYED_GCODE ID=TEST_SFS_RETRACTION_STEP DURATION=0
  SET_GCODE_VARIABLE MACRO=TEST_SFS_RETRACTION VARIABLE=active VALUE=0
  M104 S0
  M117 SFS test: stopped

[delayed_gcode TEST_SFS_RETRACTION_STEP]
gcode:
  {% set m = printer["gcode_macro TEST_SFS_RETRACTION"] %}
  {% if m.active|int == 1 and m.cycle|int < m.max_cycles|int %}
    G1 E-{m.retract_len} F1800
    G1 E{m.retract_len} F1800
    SET_GCODE_VARIABLE MACRO=TEST_SFS_RETRACTION VARIABLE=cycle VALUE={m.cycle|int + 1}
    UPDATE_DELAYED_GCODE ID=TEST_SFS_RETRACTION_STEP DURATION={m.dwell_ms|float / 1000}
  {% else %}
    SET_GCODE_VARIABLE MACRO=TEST_SFS_RETRACTION VARIABLE=active VALUE=0
    M104 S0
    M117 SFS test: complete
  {% endif %}

[gcode_macro SFS_PARK]
gcode:
  {% set x_park = printer.toolhead.axis_maximum.x - 5 %}
  {% set y_park = printer.toolhead.axis_maximum.y - 5 %}
  M400
  G90
  G1 X{x_park} Y{y_park} F9000

[gcode_macro SFS_INSERT]
gcode:
  SET_GCODE_VARIABLE MACRO=SFS_RUNOUT VARIABLE=triggered VALUE=0
  M117 Filament detected

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
  UPDATE_DELAYED_GCODE ID=PAUSE_AUTO_CANCEL DURATION=0

  {% if printer.pause_resume.is_paused %}
    SET_GCODE_VARIABLE MACRO=SFS_RUNOUT VARIABLE=triggered VALUE=0
    M117 Resuming print
    RESUME_BASE
  {% endif %}


#####################################################################
# Filament Sensors
#####################################################################

[filament_switch_sensor sfs_switch]
switch_pin: ^PC0
pause_on_runout: False
runout_gcode: SFS_RUNOUT SOURCE=SWITCH
insert_gcode: SFS_INSERT

[filament_motion_sensor sfs_motion]
switch_pin: ^PF10
extruder: extruder
detection_length: 3.6
pause_on_runout: False
runout_gcode: SFS_RUNOUT SOURCE=MOTION

#####################################################################
# BED PID SETTLE — FIXED (TOP LEVEL)
#####################################################################

[gcode_macro BED_PID_SETTLE]
variable_target: 0.0
variable_tol: 0.3
variable_stable_ms: 30000
variable_max_ms: 600000
variable_start_time: 0
variable_stable_time: 0
gcode:
  SET_GCODE_VARIABLE MACRO=BED_PID_SETTLE VARIABLE=target VALUE={params.TARGET|float}
  SET_GCODE_VARIABLE MACRO=BED_PID_SETTLE VARIABLE=tol VALUE={params.TOL|float}
  SET_GCODE_VARIABLE MACRO=BED_PID_SETTLE VARIABLE=stable_ms VALUE={params.STABLE_MS|int}
  SET_GCODE_VARIABLE MACRO=BED_PID_SETTLE VARIABLE=max_ms VALUE={params.MAX_MS|int}
  SET_GCODE_VARIABLE MACRO=BED_PID_SETTLE VARIABLE=start_time VALUE={printer.toolhead.estimated_print_time|int}
  SET_GCODE_VARIABLE MACRO=BED_PID_SETTLE VARIABLE=stable_time VALUE=0
  M117 Bed settling
  UPDATE_DELAYED_GCODE ID=BED_PID_SETTLE_CHECK DURATION=1

[delayed_gcode BED_PID_SETTLE_CHECK]
gcode:
  {% set m = printer["gcode_macro BED_PID_SETTLE"] %}
  {% set t = printer.heater_bed.temperature|float %}
  {% set now = printer.toolhead.estimated_print_time|int %}
  {% if (now - m.start_time) * 1000 >= m.max_ms %}
    M117 Bed settle timeout
    UPDATE_DELAYED_GCODE ID=BED_PID_SETTLE_CHECK DURATION=0
  {% elif (t - m.target)|abs <= m.tol %}
    {% if m.stable_time == 0 %}
      SET_GCODE_VARIABLE MACRO=BED_PID_SETTLE VARIABLE=stable_time VALUE={now}
      UPDATE_DELAYED_GCODE ID=BED_PID_SETTLE_CHECK DURATION=1
    {% elif (now - m.stable_time) * 1000 >= m.stable_ms %}
      M117 Bed stable
      UPDATE_DELAYED_GCODE ID=BED_PID_SETTLE_CHECK DURATION=0
    {% else %}
      UPDATE_DELAYED_GCODE ID=BED_PID_SETTLE_CHECK DURATION=1
    {% endif %}
  {% else %}
    SET_GCODE_VARIABLE MACRO=BED_PID_SETTLE VARIABLE=stable_time VALUE=0
    UPDATE_DELAYED_GCODE ID=BED_PID_SETTLE_CHECK DURATION=1
  {% endif %}

#####################################################################
# AUTO FAN PROFILE
#####################################################################

[gcode_macro AUTO_FAN_PROFILE]
gcode:
  {% set m = params.MATERIAL|upper %}
  {% if m in ["ABS","ASA","NYLON","PC"] %}
    SET_FAN_SPEED FAN=fan SPEED=0
  {% elif m in ["PETG","NGEN"] %}
    SET_FAN_SPEED FAN=fan SPEED=0.25
  {% elif m in ["NGEN FLEX","NGEN_FLEX","TPU","TPE"] %}
    SET_FAN_SPEED FAN=fan SPEED=0.10
  {% endif %}

#####################################################################
# PRINT START — GOLDEN
#####################################################################

[gcode_macro PRINT_START]
gcode:
  {% set bed = params.BED|int %}
  {% set hotend = params.EXTRUDER|int %}
  {% set material = params.MATERIAL|upper %}
  {% set x = printer.toolhead.axis_maximum.x / 2 %}
  {% set y = printer.toolhead.axis_maximum.y / 2 %}

  CLEAR_PAUSE
  SET_GCODE_VARIABLE MACRO=SFS_RUNOUT VARIABLE=triggered VALUE=0
  UPDATE_DELAYED_GCODE ID=PAUSE_AUTO_CANCEL DURATION=0
  SET_FILAMENT_SENSOR SENSOR=sfs_switch ENABLE=1
  SET_FILAMENT_SENSOR SENSOR=sfs_motion ENABLE=1

  G28
  G90
  G1 X{x} Y{y} Z15 F9000

  M107
  M190 S{bed}

  {% if bed >= 90 %}
    BED_PID_SETTLE TARGET={bed} TOL=0.3 STABLE_MS=30000 MAX_MS=600000
  {% elif bed >= 70 %}
    BED_PID_SETTLE TARGET={bed} TOL=0.4 STABLE_MS=20000 MAX_MS=240000
  {% endif %}

  APPLY_Z_BIAS MATERIAL={material}

  M109 S{hotend}
  AUTO_FAN_PROFILE MATERIAL={material}

  M83
  G92 E0
  G1 X5 Y4 Z0.4 F10000
  G1 X115 E20 F1000
  G92 E0

[gcode_macro END_PRINT]
description: Safe end-of-print park with material-aware cooldown (V0)
gcode:
  M400                          ; Finish all queued moves

  {% set material = params.MATERIAL|default("GENERIC")|upper %}

  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E-3 F1800                ; Small retract to reduce ooze
    G90
  {% endif %}

  {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
  {% set current_z = printer.toolhead.position.z|float %}
  {% set lift = 5.0 %}
  {% if current_z + lift > max_z %}
    {% set lift = max_z - current_z %}
  {% endif %}

  {% if lift > 0 %}
    G91
    G1 Z{lift} F3000            ; Z-safe lift
    G90
  {% endif %}

  {% set x_park = printer.toolhead.axis_maximum.x - 5 %}
  {% set y_park = printer.toolhead.axis_maximum.y - 5 %}
  G1 X{x_park} Y{y_park} F9000  ; Park back-right

  ; -------- MATERIAL-AWARE COOLDOWN --------
  {% if material in ["ABS","ASA","PC"] %}
    M104 S140                   ; Controlled hotend cooldown
    M140 S60                    ; Hold bed to reduce warp
    M117 Cooling ({material}) – bed hold
  {% else %}
    M104 S0                     ; Hotend off
    M140 S0                     ; Bed off
    M117 Print complete
  {% endif %}

  M107                          ; Fan off



