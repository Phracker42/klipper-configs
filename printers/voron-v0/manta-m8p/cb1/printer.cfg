#####################################################################
# CHANGELOG — printer.cfg
#
# Format:
#   - Version number
#   - Date (YYYY-MM-DD)
#   - Status (Frozen / Testing / Deprecated)
#   - Summary of changes
#
# ---------------------------------------------------
#
# ---------------------------------------------------
#
# v1.7 — 2026-08-02 — TESTING
# - Fixed SET_PRINT_STATS_INFO override silently clobbering
#   mainsail.cfg's pause_next_layer / pause_at_layer handling
#   (Mainsail UI "pause at layer" was a no-op prior to this fix)
# - Uncommented control:pid for [extruder] and [heater_bed] and
#   synced Kp/Ki/Kd to the real tuned values from SAVE_CONFIG,
#   so heating is correctly configured even without SAVE_CONFIG
# - Fixed AUTO_FAN_PROFILE in PRINT_START being immediately undone
#   by M107 a few lines later, before the hotend even finished
#   heating — material-based part-fan speed never actually reached
#   the print. Moved M107 to right after homing (fan off during
#   heat-soak) and AUTO_FAN_PROFILE to right before the priming
#   purge, so the material-correct speed is what actually sticks.
#
# ---------------------------------------------------
#
# v1.6 — 2026-02-17 — TESTING
# - Added SFS motion fail counter with debounce guard
#   (min_interval = 8s, fail_required = 2)
# - Added live SFS debug output via LCD (M117):
#   * debounce timing
#   * fail counter
#   * jam confirmation
# - Increased motion detection_length to 3.2 mm
# - Hardened SFS against retraction and elastic filament effects
# - Added material-aware END_PRINT with:
#   * Z-safe lift
#   * back-right park
#   * controlled cooldown for ABS / ASA / PC
# - Integrated pause auto-cancel arming during SFS events
#
# ---------------------------------------------------
#
# v1.5 — 2026-02-16 — FROZEN
# - Fixed false SFS motion jams by eliminating PTFE float
# - Enabled guarded SFS motion sensing (detection_length = 3.4 mm)
# - Added Z-safe END_PRINT with back-right park
# - Added material-aware cooldown logic at END_PRINT
# - Finalized Z-bias system (auto-clear after layer 2)
# - Added pause auto-cancel (armed only during SFS events)
#
# ---------------------------------------------------
#
# v1.4 — 2026-02-15 — DEPRECATED
# - Initial SFS integration
# - Motion sensor unstable due to PTFE compliance
# - END_PRINT missing Z safety (possible nozzle drag)
#
# ---------------------------------------------------
#
# v1.3 — 2026-02-14 — DEPRECATED
# - Early motion guard implementation
# - Detection length experimentation (2.6–4.0 mm)
# - False positives under retraction-heavy prints
#
# ---------------------------------------------------
#
# v1.2 — 2026-02-13 — DEPRECATED
# - Unified SFS runout handler (motion + switch)
# - Initial Z-bias macros
# - Chamber monitoring experiments
#
# ---------------------------------------------------
#
# v1.1 — 2026-02-12 — DEPRECATED
# - First Klipper migration to Manta M8P + CB1
# - Basic PRINT_START / END_PRINT macros
#
# ---------------------------------------------------
#
# v1.0 — 2026-02-11 — DEPRECATED
# - Baseline Voron V0.2 configuration
#
